name: construir-apk-nativo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Bajar codigo
        uses: actions/checkout@v4
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Asegurar platform 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-gradle-home: true
      - name: Compilar
        run: gradle --no-daemon :app:assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: jvcprogame-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
