name: construir-apk-nativo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-24.04
    steps:
      - name: Bajar codigo
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar el SDK del runner
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SM" ]; then
            echo "No hay sdkmanager: descargando cmdline-tools"
            curl -fL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"

      - name: Licencias y platform 34
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-gradle-home: true

      - name: Compilar
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: jvcprogame-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
